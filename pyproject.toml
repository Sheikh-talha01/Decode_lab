[project]
name = "decode_lab"
version = "0.1.0"
description = "Automated Copywriting & Tone Transformer"
requires-python = ">=3.10"
dependencies = [
  "httpx[http2]==0.24.1",
  "pydantic==1.10.12",
  "tenacity==8.2.2",
  "pytest==7.4.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
