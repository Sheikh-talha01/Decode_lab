name: CI

on:
  push:
    branches: [ main, feature/project1 ]
  pull_request:

jobs:
  project1-tests:
    name: Project1 tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r project1/requirements.txt
      - name: Run project1 tests
        run: pytest -q project1/tests

  project2-tests:
    name: Project2 tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r project2/requirements.txt
      - name: Run project2 tests
        run: |
          export PYTHONPATH=project2/src || set PYTHONPATH=project2/src
          pytest -q project2/tests

  build-and-publish:
    name: Build and publish Docker images (optional)
    runs-on: ubuntu-latest
    needs: [project1-tests, project2-tests]
    if: ${{ secrets.DOCKERHUB_USERNAME && secrets.DOCKERHUB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Build and push project1 image
        uses: docker/build-push-action@v5
        with:
          context: project1
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/decode_lab:project1-${{ github.sha }}
      - name: Build and push project2 image
        uses: docker/build-push-action@v5
        with:
          context: project2
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/decode_lab:project2-${{ github.sha }}
